name: Test and package
on:
  push:
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS-arm64
          - os: macos-15-intel
            name: macOS-x64
          - os: windows-2022
            name: Windows-x64
          - os: ubuntu-22.04
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Package and smoke-test native executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: IliasSync-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
